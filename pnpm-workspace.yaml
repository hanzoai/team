# One version of everything, named once. `@hanzo/ui` peer-depends on the
# `@hanzogui/*` set at 8.3.5 while npm's latest for those is 8.4.4, so a
# floating install resolves two trees of gui's core and the theme context breaks
# across the seam. Pinning + overrides in pnpm-workspace.yaml guarantees a single
# `@hanzogui/*` tree across the entire dependency graph.

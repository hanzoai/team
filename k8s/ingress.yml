# hanzo.team → team-landing (static site via hanzoai/static)
# app.hanzo.team → front (Svelte collaboration app)
# bot.hanzo.team → playground control-plane (shared bot registry + UI)
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-ingress
  namespace: team
  annotations:
    hanzo.ai/proxy-body-size: 100m
    hanzo.ai/proxy-read-timeout: "3600"
    hanzo.ai/proxy-send-timeout: "3600"
spec:
  ingressClassName: ingress
  tls:
    - hosts:
        - hanzo.team
        - app.hanzo.team
        - bot.hanzo.team
      secretName: hanzo-team-tls
  rules:
    - host: hanzo.team
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: team-landing
                port:
                  number: 3000
    - host: app.hanzo.team
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front
                port:
                  number: 8080
    - host: bot.hanzo.team
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: playground
                port:
                  number: 8080

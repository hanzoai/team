# Hanzo Team landing page — Next.js static site
# Image: ghcr.io/hanzoai/team-site:latest
# Health: /health on port 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-landing
  namespace: team
  labels:
    app: team-landing
    app.kubernetes.io/name: team-landing
    app.kubernetes.io/part-of: hanzo-team
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: team-landing
  template:
    metadata:
      labels:
        app: team-landing
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: team-landing
          image: ghcr.io/hanzoai/team-site:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_APP_URL
              value: "https://app.hanzo.team"
            - name: NEXT_PUBLIC_SITE_URL
              value: "https://hanzo.team"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: team-landing
  namespace: team
  labels:
    app: team-landing
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: team-landing

---
# Front (Web UI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: front
          image: hanzoai/front:5.1.1
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: team-secret
                  key: server_secret
            - name: ACCOUNTS_URL
              value: "https://hanzo.team/_accounts"
            - name: REKONI_URL
              value: "https://hanzo.team/_rekoni"
            - name: STATS_URL
              value: "https://hanzo.team/_stats"
            - name: GMAIL_URL
              value: "http://localhost:8088"
            - name: TELEGRAM_URL
              value: "http://localhost:8086"
            - name: LOVE_ENDPOINT
              value: "http://localhost:8096"
            - name: CALENDAR_URL
              value: "http://localhost:8095"
            - name: UPLOAD_URL
              value: "/files"
            - name: ELASTIC_URL
              value: "http://elastic:9200"
            - name: COLLABORATOR_URL
              value: "wss://hanzo.team/_collaborator"
            - name: STORAGE_CONFIG
              value: "s3|minio:9000?accessKey=hanzo&secretKey=hanzo-minio-secret"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: team-secret
                  key: mongodb_url
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: team-secret
                  key: mongodb_url
            - name: AI_URL
              value: "http://ai-bot:4010"
            - name: TITLE
              value: "Hanzo Team"
            - name: DEFAULT_LANGUAGE
              value: "en"
            - name: LAST_NAME_FIRST
              value: "true"
            - name: BRANDING_PATH
              value: "/var/cfg/branding.json"
            - name: HIDE_LOCAL_LOGIN
              value: "true"
            - name: DISABLE_SIGNUP
              value: "true"
          volumeMounts:
            - name: index-patch
              mountPath: /app/dist/index.html
              subPath: index.html
            - name: branding
              mountPath: /var/cfg/branding.json
              subPath: branding.json
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: index-patch
          configMap:
            name: front-index-patch
        - name: branding
          configMap:
            name: team-branding
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: team
spec:
  selector:
    app: front
  ports:
    - port: 8080
      targetPort: 8080

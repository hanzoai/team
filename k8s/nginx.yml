apiVersion: v1
kind: ConfigMap
metadata:
  name: team-nginx-config
  namespace: team
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        client_max_body_size 100M;

        location = /branding.json {
            alias /var/cfg/branding.json;
            default_type application/json;
            add_header Cache-Control "public, max-age=300";
        }

        location /hanzoai/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            rewrite ^/hanzoai/(.*)$ /huly/$1 break;
            proxy_pass http://front:8080;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://front:8080;
        }

        location /_accounts {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/_accounts(/.*)$ $1 break;
            proxy_pass http://account:3000/;
        }

        location /_collaborator {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            rewrite ^/_collaborator(/.*)$ $1 break;
            proxy_pass http://collaborator:3078/;
        }

        location /_transactor {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            rewrite ^/_transactor(/.*)$ $1 break;
            proxy_pass http://transactor:3333/;
        }

        location ~ ^/eyJ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://transactor:3333;
        }

        location /_rekoni {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/_rekoni(/.*)$ $1 break;
            proxy_pass http://rekoni:4004/;
        }

        location /_stats {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/_stats(/.*)$ $1 break;
            proxy_pass http://stats:4900/;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-nginx
  namespace: team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-nginx
  template:
    metadata:
      labels:
        app: team-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.21.3
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: branding
              mountPath: /var/cfg/branding.json
              subPath: branding.json
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 250m
      volumes:
        - name: nginx-config
          configMap:
            name: team-nginx-config
        - name: branding
          configMap:
            name: team-branding
---
apiVersion: v1
kind: Service
metadata:
  name: team-nginx
  namespace: team
spec:
  selector:
    app: team-nginx
  ports:
    - port: 80
      targetPort: 80

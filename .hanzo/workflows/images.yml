name: images
# THE builder for the three ghcr.io/hanzoai images this repo owns and
# hanzoai/universe deploys:
#
#   pods/front                                            -> ghcr.io/hanzoai/front
#   services/love                                         -> ghcr.io/hanzoai/love
#   services/analytics-collector/pod-analytics-collector  -> ghcr.io/hanzoai/analytics-collector
#
# `.github/workflows/build-images.yml` cut them until the native-forge migration
# deleted it and put nothing in its place, so main has had NO builder: the live
# pins (front v0.7.404, love v0.7.388, analytics-collector v0.7.390) are the last
# images GitHub Actions ever produced and every commit since has shipped nothing.
#
# Every build publishes TWO tags per image — a semver, derived by hanzoai/ci's
# bin/imgver as the registry's highest plus a patch, and `sha-<sha7>` beside it.
# The version is the one a universe pin names; the sha says which commit it is.
#
# This runs on the git.hanzo.ai runner pool; ghcr auth is the hanzoai org's
# GHCR_USER / GHCR_TOKEN, the same pair every other native pipeline uses.
#
# Adding `.hanzo/workflows/` switches this repo's `.github/workflows/` off
# wholesale — the forge's WORKFLOW_DIRS is first-match, not a union. Nothing is
# lost here: that directory holds only `integrations._yml`, whose extension is
# not one the forge reads, so it was already inert.
#
# ROLLOUT IS NOT HERE. This cuts images. WHICH image runs is a reviewed pin bump
# in hanzoai/universe applied by cd.hanzo.ai, whose selfHeal reverts a CI-side
# patch within minutes.

on:
  push:
    branches: [main]
    # A prose-only commit would rebuild byte-identical images across a ~200-project
    # workspace on a 10-runner shared pool. Code changes still trigger; use
    # workflow_dispatch to force one.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    # Must name a label the runners actually advertise (git-runner-config
    # runner.labels). A label nothing carries does not fail — it queues.
    runs-on: [hanzo-build-linux-amd64]
    timeout-minutes: 180
    env:
      # ONE list, read three times. Left: the Rush project to build
      # (@hanzoteam/<name>). Right: the image its own package.json `docker:build`
      # already produces (ghcr.io/hanzoai/<name>). Adding an image is a line here.
      BUILDS: |
        pod-front front
        pod-love love
        pod-analytics-collector analytics-collector

      # Read by the repo's own common/scripts/docker_build.sh, so the images are
      # tagged into the ghcr namespace at build time and never re-tagged.
      DOCKER_REGISTRY: ghcr.io/
      DOCKER_EXTRA: --platform=linux/amd64
      # Drop each pod's bundle/ and dist/ once its image exists. The runner's
      # docker-storage is a 38Gi emptyDir shared by every job on the pod, and
      # exceeding it EVICTS the pod mid-build.
      DOCKER_BUILD_CLEANUP: 'true'

      # Bound the V8 heap to what this POD can hold, not to what the node has: a
      # job here sees the node's 32 GB, never the pod's 26Gi limit, so an
      # unbounded heap sizes itself against memory the cgroup will not give it.
      # 4096 is measured, not guessed — under it the dev/prod webpack build
      # compiles the full 91.5 MiB module graph in 161s without ever reaching the
      # ceiling, and it is the heap the previous GitHub builder had by default on
      # a 16 GB ubuntu-latest runner when it cut the images now in production.
      NODE_OPTIONS: --max-old-space-size=4096
      # Some workspace dev deps fetch a browser on postinstall. Nothing here runs one.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # caniuse-lite is pinned by the lockfile, so browserslist starts printing an
      # "N months old" notice once that pin crosses six months. It writes to
      # stderr, rush scores any stderr from an operation as a warning, and
      # `_phase:package` sets allowWarningsOnSuccess:false — so rush exits 1 with
      # "Operations succeeded with warnings" AFTER all three images have already
      # been built, and the push steps are skipped by `success()`. Silencing the
      # notice keeps that phase strict for warnings that are about this code: the
      # resolved target list is byte-identical either way, so the bundles do not
      # change. Refreshing caniuse-lite instead would regenerate the lockfile the
      # install step deliberately treats as frozen — that is a reviewed dependency
      # bump, not a build fix.
      BROWSERSLIST_IGNORE_OLD_DATA: '1'

    steps:
      # Full history + tags: the bundles stamp their version from `git describe`
      # (common/scripts/show_tag.js, show_version.js). Shallow silently stamps the
      # fallback instead of failing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # v22 per .nvmrc (rush.json admits >=20 <26). Pinned to the file so the
      # runner image's own node cannot drift the build.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # THE VERSION THIS BUILD PUBLISHES, and the sha beside it. Two names for one
      # build: the version a pin can read, the sha to trace it back to a commit.
      #
      # This step used to compute `sha-<sha7>` and nothing else, so a sha was the
      # only tag these three images had ever been given by this lane — which is
      # why universe still pins front at v0.7.404, cut by the GitHub builder that
      # the forge migration deleted. A pin cannot name what a build never named.
      #
      # bin/imgver is the fleet's ONE implementation of the number (hanzoai/ci@v1,
      # the same script its build.yml runs): the highest semver already at the
      # registry for that image, plus a patch, so one name can never cover two
      # digests. Read once per image and the MAXIMUM taken, because one commit
      # here cuts three images that move together — one number names the set, and
      # the max is free on all three (front is furthest along at v0.7.404, love at
      # v0.7.388, analytics-collector at v0.7.390).
      #
      # Nothing backs imgver up if the registry read fails, ON PURPOSE: this repo
      # declares no version anywhere imgver looks, so it exits non-zero and the
      # build goes red rather than quietly re-publishing a number already out
      # there over different bytes.
      - name: The version this build publishes
        env:
          # imgver reads the registry floor over the GitHub Packages API. This is
          # the credential that pushes these three packages a few steps below, so
          # it is the one proven to see them.
          GH_PAT: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          # The forge first — it is where hanzoai/ci is written, GitHub is its
          # mirror — and the break tests for the TOOL, so a host answering with
          # the wrong tree falls through instead of dead-ending.
          for url in https://git.hanzo.ai/hanzoai/ci https://github.com/hanzoai/ci; do
            git clone -q --depth 1 --branch v1 "$url" "$RUNNER_TEMP/ci" \
              && [ -x "$RUNNER_TEMP/ci/bin/imgver" ] && break
            rm -rf "$RUNNER_TEMP/ci"
          done
          [ -x "$RUNNER_TEMP/ci/bin/imgver" ] \
            || { echo "::error::could not fetch hanzoai/ci@v1 (bin/imgver) from any host"; exit 1; }
          version=$(while read -r _project image; do
            [ -n "$image" ] || continue
            "$RUNNER_TEMP/ci/bin/imgver" "ghcr.io/hanzoai/$image" .
          done <<< "$BUILDS" | sort -V | tail -1)
          [ -n "$version" ] || { echo "::error::imgver named no version"; exit 1; }
          echo "publishing $version"
          echo "DOCKER_VERSION=$version" >> "$GITHUB_ENV"
          echo "SHA_TAG=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      # Frozen install from the committed lockfile. NOT `rush update`: that
      # regenerates the lock, so CI would build a dependency graph nobody
      # reviewed. A stale lock must fail here, loudly.
      - name: Install the workspace
        run: node common/scripts/install-run-rush.js install

      # `--to` selects each pod plus its dependency closure (292 of the repo's 485
      # projects), and of those exactly these three declare a `_phase:docker-build`
      # — so precisely three images are built. One invocation, not one job per
      # image: the three pods share most of that closure, and a matrix would
      # install the workspace and compile the shared libraries three times over.
      #
      # -p 2 bounds the fan-out. `nproc` inside a job here reports the NODE's
      # cores, not the runner pod's 6-CPU / 26Gi limit, so rush's default
      # parallelism oversubscribes the cgroup — the same hole GOFLAGS=-p=2 closes
      # for Go in the runner's own config, and the same number. It matters most at
      # the tail, where the webpack package step runs alongside buildkit
      # extracting base layers for the other two images.
      #
      # -v streams each operation's output. It is load-bearing, not decoration:
      # rush's buffered failure summary reports only the last few lines, which for
      # this build is a browserslist notice and `Exit code: 1` — no cause at all.
      # Streamed, the same failure names itself ("compiled with 2 errors" and the
      # two module paths). Without -v this pipeline reports build breakage as a
      # blank log, which is indistinguishable from infrastructure failure.
      - name: Build the images
        run: |
          set -euo pipefail
          to=""
          while read -r project _image; do
            [ -n "$project" ] || continue
            to="$to --to @hanzoteam/$project"
          done <<< "$BUILDS"
          echo "building:$to"
          node common/scripts/install-run-rush.js docker:build -v -p 2 $to

      # Without this the push is unauthenticated and 403s at the registry.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # docker_build.sh already applied `:$DOCKER_VERSION` and the bare name, which
      # is `:latest`. The sha is applied here rather than there because it is a
      # second name for bytes the build has already produced, not an input to it.
      # `latest` MOVES ONLY ON MAIN — a workflow_dispatch from a branch must not
      # repoint the floating tag production reads.
      - name: Push the images
        run: |
          set -euo pipefail
          while read -r _project image; do
            [ -n "$image" ] || continue
            docker tag "ghcr.io/hanzoai/$image:$DOCKER_VERSION" "ghcr.io/hanzoai/$image:$SHA_TAG"
            docker push "ghcr.io/hanzoai/$image:$DOCKER_VERSION"
            docker push "ghcr.io/hanzoai/$image:$SHA_TAG"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              docker push "ghcr.io/hanzoai/$image:latest"
            fi
          done <<< "$BUILDS"

      # A push can return before its manifest resolves, so a green run could still
      # mean a future ImagePullBackOff. Prove every tag pulls.
      - name: Verify the pushed images resolve
        run: |
          set -euo pipefail
          while read -r _project image; do
            [ -n "$image" ] || continue
            ref="ghcr.io/hanzoai/$image:$DOCKER_VERSION"
            ok=false
            for i in 1 2 3 4 5 6; do
              if docker manifest inspect "$ref" >/dev/null 2>&1; then ok=true; break; fi
              echo "$ref not visible yet (attempt $i/6) — retrying"
              sleep 5
            done
            if [ "$ok" != true ]; then
              echo "::error::pushed image never resolved: $ref"
              exit 1
            fi
            # A pin is repo:tag@digest — the tag is how a human reads the release,
            # the digest is what the kubelet actually honours. Print both, so the
            # pin can be read off the run instead of looked up separately later.
            dig=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref" 2>/dev/null | cut -d@ -f2)
            echo "resolved $ref${dig:+@$dig}"
          done <<< "$BUILDS"

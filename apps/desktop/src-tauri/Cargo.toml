[package]
name = "hanzo-team-desktop"
version = "1.0.0"
description = "Hanzo Team desktop application"
authors = ["Hanzo AI, Inc. <dev@hanzo.ai>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-opener = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

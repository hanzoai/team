# Hanzo CI/CD — hanzo.team. All real config is here; .hanzo/workflows/cicd.yml is
# triggers and an import of hanzoai/ci.

test:
  - name: install
    run: |
      set -e
      corepack enable
      pnpm install --frozen-lockfile

  # `pnpm build` is `tsc --noEmit && vite build`. A vite build that emits
  # nothing still exits 0, hence the file test.
  - name: build
    run: |
      set -e
      pnpm build
      test -s dist/index.html

site:
  # hanzo.team is published by hanzo-inc/team, which pins a version of this
  # app's npm package (@hanzo/team, .github/workflows/publish.yml) and ships its
  # dist/. So nothing here publishes a site: one publisher per host. This stays
  # the open-source app; the build and test above still run.
  # Both repositories write the same prefix, hanzo/hanzo-team. A bad release is
  # rolled back in hanzo-inc/team by reverting its version bump.
  #
  # `on:` defaults to the empty list, and an unnamed branch runs the build,
  # reports success and ships nothing.
  slug: hanzo-team
  dir: dist
  on: []
  build: pnpm build

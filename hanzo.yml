# Hanzo CI/CD — hanzo.team. All real config is here; .hanzo/workflows/cicd.yml is
# triggers and an import of hanzoai/ci.

test:
  - name: install
    run: |
      set -e
      corepack enable
      pnpm install --frozen-lockfile

  # `pnpm build` is `tsc --noEmit && vite build`. A vite build that emits
  # nothing still exits 0, hence the file test.
  - name: build
    run: |
      set -e
      pnpm build
      test -s dist/index.html

site:
  # hanzo.team, and this repository is the only thing that publishes it: the
  # earlier Next.js workspace (hanzo-apps/team) also wrote this slug, so the
  # host served whichever pushed last, and it is archived.
  #
  # `on:` defaults to the empty list, and an unnamed branch runs the build,
  # reports success and ships nothing.
  slug: hanzo-team
  dir: dist
  on: [main]
  build: pnpm build

# Publishes @hanzo/team, the built app (dist/), when package.json names a version
# npm does not serve yet. hanzo.team is Hanzo's deployment of it: hanzo-inc/team
# pins a version and publishes that package's dist/ as the hanzo-team site. This
# repository is the open-source app and ships nothing to a host itself.
#
# The registry decides, not the diff: a version strictly greater than npm's
# `latest` is a release and anything else is not, so a re-run is a no-op. The
# token is read from KMS at run time (NPM_TOKEN, env prod), as hanzoai/app's
# publish.yml does.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Is this version ahead of npm?
        id: ahead
        run: |
          set -euo pipefail
          NAME=$(jq -r .name package.json)
          NEW=$(jq -r .version package.json)
          # The version itself first: the full packument lags a fresh publish by
          # minutes, and reading that 404 as "never published" re-publishes into
          # a 403.
          if curl -sf -o /dev/null "https://registry.npmjs.org/${NAME}/${NEW}"; then
            echo "$NAME $NEW is already on npm"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          OLD=$(curl -sf -H 'Accept: application/vnd.npm.install-v1+json' "https://registry.npmjs.org/${NAME}" | jq -r '."dist-tags".latest // "0.0.0"' || echo 0.0.0)
          TOP=$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)
          if [ "$OLD" != "$NEW" ] && [ "$TOP" = "$NEW" ]; then
            echo "$NAME $OLD -> $NEW"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME $NEW is not ahead of npm ($OLD)"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.ahead.outputs.release == 'true'

      - uses: actions/setup-node@v4
        if: steps.ahead.outputs.release == 'true'
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # The bytes that ship: `pnpm build` is `tsc --noEmit && vite build`, and a
      # vite build that emits nothing still exits 0, hence the file tests.
      - name: Test and build
        if: steps.ahead.outputs.release == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          test -s dist/index.html
          test -s dist/404.html
          ls dist/assets/*.js >/dev/null

      - name: Read the npm token from KMS
        if: steps.ahead.outputs.release == 'true'
        id: npm
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
        run: |
          set -uo pipefail
          body="{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}"
          out=$(curl -sS -w '\n%{http_code}' "${KMS_ENDPOINT}/v1/kms/auth/login" -H 'Content-Type: application/json' --data-binary "$body")
          code=${out##*$'\n'}; resp=${out%$'\n'*}
          [ "$code" = "200" ] || { echo "::error::KMS login answered HTTP $code"; exit 1; }
          token=$(printf '%s' "$resp" | jq -r '.accessToken // empty')
          [ -n "$token" ] || { echo "::error::KMS login carried no accessToken"; exit 1; }
          for attempt in 1 2 3 4 5; do
            out=$(curl -sS -w '\n%{http_code}' "${KMS_ENDPOINT}/v1/kms/secrets/NPM_TOKEN?env=${KMS_SECRET_ENV}" -H "Authorization: Bearer ${token}")
            code=${out##*$'\n'}; resp=${out%$'\n'*}
            case "$code" in 200) break ;; 5*) sleep 15 ;; *) break ;; esac
          done
          [ "$code" = "200" ] || { echo "::error::KMS secret read answered HTTP $code"; exit 1; }
          npm_token=$(printf '%s' "$resp" | jq -r '.value // empty')
          [ -n "$npm_token" ] || { echo "::error::No NPM_TOKEN in KMS"; exit 1; }
          echo "::add-mask::${npm_token}"
          echo "token=${npm_token}" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.ahead.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm.outputs.token }}
        run: pnpm publish --access public --no-git-checks

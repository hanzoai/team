name: Test Team Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: team
          POSTGRES_PASSWORD: password
          POSTGRES_DB: team_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'" 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      minio:
        image: bitnami/minio:latest
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Rush
      run: npm install -g @microsoft/rush
    
    - name: Rush install
      run: rush install
    
    - name: Rush build
      run: rush build
    
    - name: Run linting
      run: |
        rush lint || true
        rush svelte-check || true
    
    - name: Run unit tests
      run: rush test
      env:
        DATABASE_URL: postgresql://team:password@localhost:5432/team_test
        MONGO_URL: mongodb://localhost:27017/team_test
        MINIO_ENDPOINT: localhost:9000
        MINIO_ACCESS_KEY: minioadmin
        MINIO_SECRET_KEY: minioadmin
    
    - name: Build all packages
      run: rush build:prod || rush build
    
    - name: Test Docker build
      run: docker build -f Dockerfile.dev -t team-test .
    
  test-models:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Rush
      run: npm install -g @microsoft/rush
    
    - name: Rush install
      run: rush install
    
    - name: Test model packages
      run: |
        cd models
        for dir in */; do
          if [ -f "$dir/package.json" ]; then
            echo "Testing model: $dir"
            cd "$dir"
            npm test || true
            cd ..
          fi
        done
    
  test-plugins:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Rush
      run: npm install -g @microsoft/rush
    
    - name: Rush install
      run: rush install
    
    - name: Test plugin packages
      run: |
        cd plugins
        for dir in */; do
          if [ -f "$dir/package.json" ] && [ -f "$dir/jest.config.js" ]; then
            echo "Testing plugin: $dir"
            cd "$dir"
            npm test || true
            cd ..
          fi
        done
    
  test-production:
    runs-on: ubuntu-latest
    needs: [test, test-models, test-plugins]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Test production setup
      run: |
        cd production
        chmod +x setup.sh
        ./setup.sh --dry-run || true
    
    - name: Validate production configs
      run: |
        cd production
        docker compose -f compose.yml config
    
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Rush
      run: npm install -g @microsoft/rush
    
    - name: Rush install
      run: rush install
    
    - name: Run security audit
      run: |
        rush audit || true
        cd common/scripts
        npm audit --audit-level=high || true
    
    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/nodejs
          p/typescript